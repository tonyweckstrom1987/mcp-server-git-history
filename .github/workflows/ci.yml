name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Hae repositorio (koko historia testejä varten)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Asenna Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Aja testit
        run: npm test

      - name: Audit
        run: npm audit --omit=dev --audit-level=high

      # mcp-doctor asettaa Node 24:n, joten se ajetaan viimeisenä ja vain Node 24 -rivillä.
      - name: MCP-terveystarkastus (mcp-doctor, savuajo)
        if: matrix.node-version == '24.x'
        uses: tonyweckstrom1987/mcp-doctor@6a5f09575dcda006cd661a9906278b42f8ea336e
        with:
          command: node bin/server.js
          smoke: smoke.json
          strict: "true"

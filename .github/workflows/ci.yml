name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Testit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Hae repositorio (koko historia testejä varten)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Asenna Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Aja testit
        run: npm test
